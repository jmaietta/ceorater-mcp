[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ceorater-mcp"
version = "1.0.2"
description = "MCP server for CEORater — CEO performance for AI agents. Free, no API key."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [{name = "Jon Maietta", email = "support@ceorater.com"}]
keywords = [
    "mcp", "model-context-protocol", "llm", "agents", "claude",
    "ceo", "finance", "investing", "analytics", "sec", "gics", "sp500",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Financial and Insurance Industry",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business :: Financial :: Investment",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "mcp[cli]>=1.0.0",
    "httpx>=0.27.0",
]

[project.urls]
Homepage = "https://www.ceorater.com"
Documentation = "https://www.ceorater.com/api-docs.html"
Repository = "https://github.com/jmaietta/ceorater-mcp"

[project.scripts]
ceorater-mcp = "ceorater_mcp.server:main"
