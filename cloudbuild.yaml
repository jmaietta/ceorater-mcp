# Push to main -> this build -> the Cloud Run service `ceorater-mcp` in
# us-central1 picks up the new image. Same shape as the backend's trigger,
# except the image comes from the Dockerfile rather than a buildpack, so the
# Python environment is the one pinned in requirements.txt.
#
# Scaling, memory, the secret and the domain are properties of the service,
# set once at creation; `services update --image` leaves them alone.
steps:
  - id: Build
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - --tag=${_IMAGE}:${COMMIT_SHA}
      - --tag=${_IMAGE}:latest
      - .
  - id: Push
    name: gcr.io/cloud-builders/docker
    args: [push, --all-tags, "${_IMAGE}"]
  - id: Deploy
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: gcloud
    args:
      - run
      - services
      - update
      - ceorater-mcp
      - --platform=managed
      - --region=us-central1
      - --image=${_IMAGE}:${COMMIT_SHA}
      - --labels=managed-by=cloud-build,commit-sha=${COMMIT_SHA},gcb-build-id=${BUILD_ID}
      - --quiet

substitutions:
  _IMAGE: us-central1-docker.pkg.dev/ceorater/cloud-run-source-deploy/ceorater-mcp

images:
  - ${_IMAGE}:${COMMIT_SHA}
  - ${_IMAGE}:latest

options:
  logging: CLOUD_LOGGING_ONLY
